<title>Habit Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a track meet. Rooms are heats, the leaderboard is a set of lanes, XP is gold. */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #F6F8FB;
  --ink: #111620;
  --muted: #5A6476;
  --line: #DCE1E9;
  --accent: #2B55F0;
  --accent-soft: #E3E9FF;
  --accent-ink: #FFFFFF;
  --xp: #C98A00;
  --xp-bright: #F4B400;
  --xp-soft: #FFF2CC;
  --good: #16935A;
  --flame: #F0602A;
  --danger: #C8343B;
  --lane: #C9D1DD;
  --shadow: 0 1px 2px rgba(17,22,32,.06), 0 8px 24px -12px rgba(17,22,32,.18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1017; --surface: #151B26; --surface-2: #1B2230; --ink: #E8ECF4; --muted: #96A0B3;
    --line: #283142; --accent: #6E8CFF; --accent-soft: #1E2949; --accent-ink: #0C1017;
    --xp: #FFC53D; --xp-bright: #FFC53D; --xp-soft: #3A2E10; --good: #3BC985; --flame: #FF8048;
    --danger: #FF6B70; --lane: #344055; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1017; --surface: #151B26; --surface-2: #1B2230; --ink: #E8ECF4; --muted: #96A0B3;
  --line: #283142; --accent: #6E8CFF; --accent-soft: #1E2949; --accent-ink: #0C1017;
  --xp: #FFC53D; --xp-bright: #FFC53D; --xp-soft: #3A2E10; --good: #3BC985; --flame: #FF8048;
  --danger: #FF6B70; --lane: #344055; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.1; text-wrap: balance; letter-spacing: -0.01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.me-chip { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; min-width: 0; }
.me-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; font-weight: 600; font-size: 14px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; flex: none; object-fit: cover; background: var(--line); }
.avatar.lg { width: 44px; height: 44px; }

main { padding-block: 22px 64px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.panel { padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.notice { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 14px; background: var(--surface-2); }
.notice.warn { border-style: solid; border-color: color-mix(in srgb, var(--xp) 50%, var(--line)); background: var(--xp-soft); color: var(--ink); }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: -0.03em; }
.hero p { max-width: 52ch; color: var(--muted); margin: 10px 0 0; font-size: 16px; }
.hero { padding-block: 6px 18px; }
.rooms { display: grid; gap: 12px; }
.room-card { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; text-decoration: none; color: inherit; }
.room-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.room-badge { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--accent-ink); background: var(--accent); }
.room-card h3 { font-size: 18px; overflow-wrap: anywhere; }
.room-meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.room-xp { text-align: right; }
.room-xp b { font-family: var(--f-mono); font-size: 18px; color: var(--xp); display: block; }
.room-xp small { color: var(--muted); font-size: 12px; }
.side { display: grid; gap: 16px; }
.join-row { display: flex; gap: 8px; }
.join-row input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .2em; font-family: var(--f-mono); font-weight: 700; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.steps li { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; font-size: 14px; }
.steps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; }

/* form controls */
.field { display: grid; gap: 6px; }
.field > span, .label { font-size: 13px; font-weight: 600; }
.input, input[type=text], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.input:focus, input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea { resize: vertical; min-height: 84px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.suggest { border-style: dashed; color: var(--muted); }
.toggle { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.toggle small { display: block; color: var(--muted); font-size: 13px; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--lane); transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.habit-edit { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 8px; align-items: center; }
.habit-edit select { padding: 9px 6px; font-size: 18px; text-align: center; }
.form { display: grid; gap: 18px; max-width: 640px; }
.form-section { display: grid; gap: 10px; }

/* room */
.room-head { display: grid; gap: 14px; margin-bottom: 18px; }
.room-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.room-title h1 { font-size: clamp(26px, 4.4vw, 38px); font-weight: 800; letter-spacing: -0.025em; overflow-wrap: anywhere; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.crumbs a { color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.crumbs a:hover { color: var(--ink); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.code-chip { font-family: var(--f-mono); font-weight: 700; letter-spacing: .14em; }
.season { display: grid; gap: 8px; }
.season-line { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.season-line b { font-family: var(--f-display); font-weight: 800; font-size: 16px; }
.ticks { display: flex; gap: 3px; height: 10px; }
.ticks i { flex: 1; border-radius: 3px; background: var(--lane); min-width: 2px; }
.ticks i.past { background: var(--accent); }
.ticks i.now { background: var(--xp-bright); }
.bar { height: 10px; border-radius: 999px; background: var(--lane); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.gold > i { background: linear-gradient(90deg, var(--xp), var(--xp-bright)); }

.room-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; align-items: start; }
.col { display: grid; gap: 20px; min-width: 0; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.habits { display: grid; gap: 8px; }
.habit { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.habit.done { background: color-mix(in srgb, var(--good) 10%, var(--surface)); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.check { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--lane); background: var(--surface); display: grid; place-items: center; color: transparent; transition: transform .12s, background .12s, border-color .12s; }
.check svg { width: 22px; height: 22px; }
.check:hover { border-color: var(--good); }
.habit.done .check { background: var(--good); border-color: var(--good); color: #fff; }
.check.pop { animation: pop .32s ease-out; }
@keyframes pop { 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.habit-name { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
.habit-name .ico { font-size: 18px; line-height: 1; }
.habit-sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.streak { display: inline-flex; align-items: center; gap: 3px; color: var(--flame); font-weight: 700; font-family: var(--f-mono); font-size: 12.5px; }
.streak svg { width: 13px; height: 13px; }
.xp-chip { font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; padding: 3px 8px; border-radius: 999px; background: var(--xp-soft); color: var(--xp); white-space: nowrap; }
.habit.done .xp-chip { background: transparent; }
.habit-right { display: flex; align-items: center; gap: 4px; }
.icon-btn { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.sub-head { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }

/* me card */
.me-top { display: flex; align-items: center; gap: 12px; }
.lvl { font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.lvl small { font-family: var(--f-body); font-weight: 600; font-size: 13px; color: var(--muted); margin-left: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 18px; }
.stat span { font-size: 12px; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.badge { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 11.5px; font-weight: 600; line-height: 1.2; }
.medal { width: 46px; height: 50px; display: grid; place-items: center; font-size: 22px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, var(--xp-bright), var(--xp)); }
.badge.locked .medal { background: var(--lane); filter: grayscale(1); opacity: .55; }
.badge.locked { color: var(--muted); }

.week { overflow-x: auto; }
.week table { border-collapse: separate; border-spacing: 4px; font-size: 12px; min-width: 100%; }
.week th { font-weight: 600; color: var(--muted); text-align: center; padding: 0 2px; }
.week th.hname { text-align: left; font-weight: 600; color: var(--ink); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week th.perfect { color: var(--xp); }
.week td { width: 26px; height: 22px; border-radius: 6px; background: var(--lane); opacity: .55; }
.week td.on { background: var(--good); opacity: 1; }
.week td.na { background: transparent; border: 1px dashed var(--line); opacity: 1; }

/* leaderboard lanes */
.lanes { display: grid; gap: 4px; }
.lane-row { display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 10px; align-items: center; padding: 10px 8px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; }
.lane-row:hover { background: var(--surface-2); }
.lane-row.me { background: var(--accent-soft); }
.rank { font-family: var(--f-display); font-weight: 800; font-size: 26px; text-align: center; color: var(--muted); }
.lane-row:nth-child(1) .rank { color: var(--xp); }
.lane-body { display: grid; gap: 6px; min-width: 0; }
.lane-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lane-top .who { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lv-chip { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.lane-top .xp { margin-left: auto; font-family: var(--f-mono); font-weight: 700; color: var(--xp); white-space: nowrap; }
.track { position: relative; height: 16px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed var(--lane); }
.track .run { position: absolute; left: 0; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 4px; background: var(--accent); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.lane-row:nth-child(1) .track .run { background: linear-gradient(90deg, var(--xp), var(--xp-bright)); }
.track .runner { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--surface); box-shadow: 0 0 0 2px var(--accent); background: var(--surface); object-fit: cover; transition: left .6s cubic-bezier(.2,.8,.2,1); }
.lane-row:nth-child(1) .track .runner { box-shadow: 0 0 0 2px var(--xp-bright); }
.lane-foot { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--lane); }
.pips i.on { background: var(--good); }
.winner { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--xp-soft); border: 1px solid color-mix(in srgb, var(--xp) 45%, var(--line)); }
.winner svg { width: 34px; height: 34px; color: var(--xp); }
.winner b { font-family: var(--f-display); font-size: 20px; overflow-wrap: anywhere; }

/* feed */
.feed { display: grid; gap: 2px; }
.post { display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 10px; padding: 10px 4px; border-top: 1px solid var(--line); }
.post:first-child { border-top: 0; }
.post .avatar { width: 32px; height: 32px; }
.post-text { font-size: 14px; overflow-wrap: anywhere; }
.post-text b { font-weight: 700; }
.post-time { font-size: 12px; color: var(--muted); }
.post-note { margin-top: 6px; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.post-photo { margin-top: 6px; max-width: min(260px, 100%); border-radius: 10px; display: block; border: 1px solid var(--line); background: var(--surface-2); min-height: 40px; }
.post-actions { margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.cheer { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; }
.cheer[aria-pressed="true"] { background: var(--xp-soft); border-color: color-mix(in srgb, var(--xp) 50%, var(--line)); }
.post.perfect .post-text b.tag { color: var(--xp); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,20,.45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); padding: 20px; display: grid; gap: 16px; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet-head h2 { font-size: 22px; font-weight: 800; overflow-wrap: anywhere; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.photo-preview { max-width: 100%; max-height: 220px; border-radius: 12px; border: 1px solid var(--line); }
.rules-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.rules-table td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.rules-table td:last-child { text-align: right; font-family: var(--f-mono); font-weight: 700; color: var(--xp); white-space: nowrap; }
.copy-box { font-family: var(--f-mono); font-size: 13px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; overflow-wrap: anywhere; user-select: all; }

/* toasts */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); animation: up .25s ease-out; text-align: center; }
.toast.gold { background: linear-gradient(90deg, var(--xp), var(--xp-bright)); color: #1D1500; }

function writeFailed(err) {

async function saveNick(v) {

}
async function createRoom(room) {

  await S.db.doc("rooms/" + code).set({ ...room, createdBy: S.me, createdAt: Date.now() });
  S.roomCache.set(code, { ...room, createdBy: S.me });
  await joinRoom(code);

async function joinRoom(code) {
  await S.db.doc("rooms/" + code + "/members/" + S.me).set({ joinedAt: Date.now() });
  const ref = S.db.doc("people/" + S.me + "/rooms/" + code);
  const existing = await ref.get();

  const body = { joinedAt: Date.now(), personal: [], log: {}, cheers: {} };

  refresh();

function toggleHabit(hb, date, btnEl) {

async function uploadPhoto(file) {

    return res.id;
  } catch (err) {
    const code = err && err.code;
    throw new Error(code === "too_large" ? "That photo is too large." : code === "quota_or_state" ? "Photo storage is full. Post a note instead." : code === "rate_limited" ? "Too many uploads. Wait a moment and try again." : "The photo didn't upload. Post a note instead.");

  if (S.myRooms.has(code)) R.mine = clone(S.myRooms.get(code));

    R.data = s.exists ? s.data() : (s.metadata.fromCache ? R.data : null);
    if (!s.metadata.fromCache) { clearTimeout(R.timer); R.timedOut = false; }

    R.members = snap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));

  S.room = null;
}

/* ---------- boot ---------- */
async function boot() {
  renderRoute();
  const c = window.claude;
  if (!c || !c.use) { S.status = "nodb"; renderRoute(); return; }
  const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
  S.db = db; S.user = user;
  if (!db) { S.status = "nodb"; renderRoute(); return; }
  S.me = user ? await user.id() : null;
  if (!S.me) { S.status = "noid"; renderRoute(); return; }
  S.meInfo = await user.me();
  S.isOwner = !!S.meInfo.isOwner;
  S.canWrite = await user.can("data.write");
  c.use("assets").then(a => { S.assets = a; }).catch(() => {});
  const timer = setTimeout(() => { S.loadTimedOut = true; refresh(); }, 10000);
  db.doc("people/" + S.me).onSnapshot(s => { if (s.exists) S.myProfile = { ...s.data() }; refresh(); }, () => {});
  db.collection("people/" + S.me + "/rooms").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.loadTimedOut = false; }
    S.myRoomsLoaded = true;
    const next = new Map();
    for (const d of snap.docs) next.set(d.id, d.data());
    // keep local edits that haven't been confirmed yet
    if (S.room && (writing || pending) && S.room.mine) next.set(S.room.code, clone(S.room.mine));
    S.myRooms = next;
    if (S.room && S.myRooms.has(S.room.code) && !writing && !pending) S.room.mine = clone(S.myRooms.get(S.room.code));
    if (S.room && S.myRooms.has(S.room.code) && !S.room.mine) S.room.mine = clone(S.myRooms.get(S.room.code));
    for (const code of next.keys()) {
      if (S.roomCache.has(code)) continue;
      S.roomCache.set(code, undefined);
      db.doc("rooms/" + code).get().then(s => { S.roomCache.set(code, s.exists ? s.data() : null); refresh(); }).catch(() => S.roomCache.delete(code));
    }
    refresh();
  }, () => { clearTimeout(timer); S.myRoomsLoaded = true; refresh(); });
  S.status = "ready";
  renderRoute();
}
window.addEventListener("hashchange", renderRoute);
setInterval(() => { if (current && current.view === "room") refresh(); }, 60000);
boot();
})();
</script>
